# Override de SinCódigo para el VPS (Contabo + EasyPanel/Traefik).
# Traefik ya ocupa 80/443, así que NO se usa Caddy: la app se publica solo en
# el puente de Docker (172.17.0.1:3210) y Traefik la enruta con TLS.
#
# Uso en el VPS (/root/vocero-crm):
#   docker compose -f docker-compose.yml -f docker-compose.sincodigo.yml up -d --build
services:
  app:
    # Imagen propia construida desde el fork (nunca la oficial).
    image: vocero-crm-sincodigo:latest
    build: .
    ports:
      - "172.17.0.1:3210:3000"
    environment:
      # Embedded Signup (Tech Provider): el compose oficial no los pasa.
      META_APP_ID: ${META_APP_ID:-}
      META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID:-}
      # Avisos push de citas (Web Push). Llaves: node scripts/sincodigo/vapid-keys.mjs
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  nea:
    environment:
      # Números que pueden mandar /reset para empezar como lead nuevo (CSV).
      TESTER_WA_IDS: ${TESTER_WA_IDS:-}
  caddy:
    profiles: ["disabled"]
